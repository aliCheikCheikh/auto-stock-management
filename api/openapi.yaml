openapi: 3.1.0

info:
  title: Auto Stock Management API
  version: 1.0.0
  summary: Stock management for an automotive spare parts shop
  description: |
    Stock management REST API.

    This hand-maintained design document is incomplete and retains historical
    schemas. Check the controllers and DTOs in `stock-infrastructure` for the
    current request and response contracts.

    ## Conventions
    - **Versioning**: URL prefix `/api/v1`; incompatible changes use `/api/v2`.
    - **Case**: `kebab-case` URL segments and `camelCase` JSON fields.
    - **IDs**: UUID v4 strings in all payloads.
    - **Dates**: ISO 8601 UTC `date-time` (`2026-04-23T10:15:30Z`).
    - **Money**: `Money { amount: string (BigDecimal), currency: ISO-4217 }`.
      Amounts use strings to avoid JavaScript precision loss.
    - **Errors**: RFC 7807 (`application/problem+json`).
    - **Idempotency**: POST sales, stock receipts and stock transfers accept an
      optional `Idempotency-Key` UUID. See `IdempotencyFilter` for replay behavior
      and current limitations; no 24-hour expiry is enforced.
    - **Pagination**: `?page=0&size=20&sort=field,asc`, with a `Page<T>` response.
    - **Auth**: JWT in the HttpOnly `access_token` cookie. See `SecurityConfig`
      for public routes and role restrictions; Authorization Bearer is not read by the current filter.

  contact:
    name: Ali Cheikh — ALMA / Nantes Université
    email: maintainer@example.test
  license:
    name: Proprietary

servers:
  - url: https://api.stock.example.com/api/v1
    description: Example production URL (not an active demo)
  - url: https://staging.api.stock.example.com/api/v1
    description: Example staging URL (not an active demo)
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Stock — Receiving
    description: Receiving goods (stock entry).
  - name: Stock — Sales
    description: Sales and automatic stock allocation.
  - name: Stock — Transfers
    description: Transfers between locations (backstock → shop floor).
  - name: Products
    description: Product catalogue queries.
  - name: Stock — Read
    description: Stock level queries.
  - name: Health
    description: Liveness / readiness.

security:
  - cookieAuth: [ ]

paths:

  # ───────────────────────────────────────────────────────────────
  # Health
  # ───────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [ Health ]
      operationId: healthCheck
      summary: Liveness probe.
      security: [ ]
      responses:
        '200':
          description: Service operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ───────────────────────────────────────────────────────────────
  # Receiving — stock entry from a supplier
  # ───────────────────────────────────────────────────────────────
  /stock-receipts:
    post:
      tags: [ Stock — Receiving ]
      operationId: receiveStock
      summary: Record a stock receipt.
      description: |
        Invoke `ReceiveStockUseCase`.

        - Omit `newProductInfo` when `productReference` identifies an existing product.
        - Otherwise, `newProductInfo` is required and the product is created.
        - `distributions` splits the received quantity across one or more
          storage locations; each line must have `quantity > 0`.

        Publish `StockReceived` and, when applicable, `StockReplenished`.

      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveStockRequest'
            examples:
              existingProduct:
                summary: Receive an existing product
                value:
                  productReference: BRK-PAD-2017-RENAULT
                  shopId: 3c4d5e6f-7a8b-4c9d-8e9f-0a1b2c3d4e5f
                  userId: 6f2a3b8a-1d0e-4d7a-8f3c-2b9c1e4a7d11
                  distributions:
                    - locationId: 1b9a1d0c-4c2f-4f8a-9a3f-2e1e7c0d3b01
                      quantity: 20
                    - locationId: 2a1b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      quantity: 30
              newProduct:
                summary: Receive and create a product
                value:
                  productReference: BRK-DISC-2019-PEUGEOT
                  shopId: 3c4d5e6f-7a8b-4c9d-8e9f-0a1b2c3d4e5f
                  userId: 6f2a3b8a-1d0e-4d7a-8f3c-2b9c1e4a7d11
                  newProductInfo:
                    name: Disque de frein avant 2019 Peugeot 208
                    reference: BRK-DISC-2019-PEUGEOT
                    categoryId: 7c1e2d3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
                    unitPrice:
                      amount: "45.90"
                      currency: EUR
                    minimumGlobalThreshold: 10
                  distributions:
                    - locationId: 1b9a1d0c-4c2f-4f8a-9a3f-2e1e7c0d3b01
                      quantity: 50
      responses:
        '202':
          description: Receipt recorded. Stock movements created and events published.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: Receipt status URL (for future auditing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReceiptAcknowledgement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ───────────────────────────────────────────────────────────────
  # Sales — automatic stock allocation
  # ───────────────────────────────────────────────────────────────
  /sales:
    post:
      tags: [ Stock — Sales ]
      operationId: sellProduct
      summary: Record a sale and allocate stock automatically.
      description: |
        Invoke `SellProductUseCase`.

        - `StockAllocationService` selects source locations, prioritizing the shop floor.
        - Fail with `STOCK_INSUFFICIENT` when available stock across all shop
          locations cannot cover the requested quantity.
        - Publish `SaleCompleted` and, when thresholds are crossed,
          `LowStockAlert` and `ShopFloorLow`.

        The body and use case support multiple product lines.

      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
            examples:
              singleLine:
                summary: Single-product sale
                value:
                  sellerId: 6f2a3b8a-1d0e-4d7a-8f3c-2b9c1e4a7d11
                  shopId: 3c4d5e6f-7a8b-4c9d-8e9f-0a1b2c3d4e5f
                  lines:
                    - productId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      quantity: 2
      responses:
        '201':
          description: Sale created.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: URL of the created sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

    get:
      tags: [ Stock — Sales ]
      operationId: listSales
      summary: Paginated sales list.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: sellerId
          in: query
          schema: { type: string, format: uuid }
        - name: shopId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Start date and time (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End date and time (exclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfSale'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sales/{saleId}:
    get:
      tags: [ Stock — Sales ]
      operationId: getSale
      summary: Sale details.
      parameters:
        - $ref: '#/components/parameters/SaleIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────────────
  # Transfers — backstock → shop floor (or reverse)
  # ───────────────────────────────────────────────────────────────
  /stock-transfers:
    post:
      tags: [ Stock — Transfers ]
      operationId: transferStock
      summary: Transfer stock between locations.
      description: |
        Invoke `TransferStockUseCase`.

        - Both locations must belong to the same shop.
        - Fail with `STOCK_INSUFFICIENT` when the source has insufficient stock.
        - Publish a `StockMovement` of type `TRANSFER`.

      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStockRequest'
            examples:
              example:
                value:
                  productId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                  sourceLocationId: 2a1b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  destinationLocationId: 1b9a1d0c-4c2f-4f8a-9a3f-2e1e7c0d3b01
                  quantity: 5
                  userId: 6f2a3b8a-1d0e-4d7a-8f3c-2b9c1e4a7d11
      responses:
        '202':
          description: Transfer accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransferAcknowledgement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ───────────────────────────────────────────────────────────────
  # Products — read only
  # ───────────────────────────────────────────────────────────────
  /products:
    get:
      tags: [ Products ]
      operationId: listProducts
      summary: Paginated product list.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: reference
          in: query
          description: Exact match on the business reference.
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfProduct'

  /products/{productId}:
    get:
      tags: [ Products ]
      operationId: getProduct
      summary: Product details.
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────────────
  # Stock — read models
  # ───────────────────────────────────────────────────────────────
  /stock-levels:
    get:
      tags: [ Stock — Read ]
      operationId: listStockLevels
      summary: Stock levels by product and location.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: shopId
          in: query
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
        - name: belowThreshold
          in: query
          description: If `true`, return only rows below the global threshold.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfStockLevel'

  /products/{productId}/stock-levels:
    get:
      tags: [ Stock — Read ]
      operationId: getProductStockLevels
      summary: Product stock by location and global total.
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
        - name: shopId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStockSummary'
        '404': { $ref: '#/components/responses/NotFound' }

  /stock-movements:
    get:
      tags: [ Stock — Read ]
      operationId: listStockMovements
      summary: Paginated stock movement history.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MovementType'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfStockMovement'

  # ───────────────────────────────────────────────────────────────
  # Debts — outstanding and settled credit sales
  #
  # Owner only: responses include customer names and phone numbers.
  # The security rule covers `/debts/**`, including new routes under this prefix.
  # ───────────────────────────────────────────────────────────────
  /debts:
    get:
      tags: [ Créances ]
      operationId: listDebts
      summary: Outstanding or settled shop debts.
      description: |
        By default, return outstanding debts, oldest first.
        With `status=SETTLED`, return settled debts, most recently settled first.
        Settled debts remain available as payment records.

        Sorting parameters are not accepted; ordering depends on the debt status.

      parameters:
        - $ref: '#/components/parameters/DebtStatusParam'
        - name: customerId
          in: query
          description: Filter by customer. When omitted, include the whole shop.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfDebt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /debts/{saleId}:
    get:
      tags: [ Créances ]
      operationId: getCreditSaleDetail
      summary: Debt details, sale lines, seller and payments.
      description: |
        Return sale lines and quantities, prices at the time of sale, seller,
        customer, and the full payment history with collector names.
        Details remain available after full settlement.

        Return `404` for cash sales without a customer, as well as missing sales.

      parameters:
        - name: saleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditSaleDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/{customerId}/debts:
    get:
      tags: [ Créances ]
      operationId: listCustomerDebts
      summary: Outstanding or settled customer debts.
      description: |
        Use the same filters, pagination and ordering as the shop-wide debt list,
        restricted to the specified customer.

      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/DebtStatusParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfDebt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ───────────────────────────────────────────────────────────────
# Components
# ───────────────────────────────────────────────────────────────
components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT access token set by the login endpoint.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Optional client-generated UUID for replaying a recorded response on retries.
        Supported on POST sales, stock receipts and stock transfers.
        No automatic expiry is enforced. See `IdempotencyFilter` for implementation
        details; this header does not guarantee exactly-once execution.

    PageParam:
      name: page
      in: query
      description: Page number (zero-based).
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

    DebtStatusParam:
      name: status
      in: query
      description: |
        Filter by settlement status. Defaults to `OUTSTANDING`.
        Request settled debt history explicitly.

      schema:
        $ref: '#/components/schemas/DebtStatus'

    SortParam:
      name: sort
      in: query
      description: |
        Sort using `field,direction` (e.g. `createdAt,desc`).
        Multiple values are allowed and applied in order.

      explode: true
      schema:
        type: array
        items: { type: string }

    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SaleIdPath:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request (syntax validation).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but missing the required role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (e.g. insufficient quantity or outdated version).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Syntactically valid request that violates a business rule.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ── Primitives ─────────────────────────────────────────────
    Money:
      type: object
      required: [ amount, currency ]
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: Decimal amount serialized as a string (BigDecimal).
          examples: [ "45.90", "1299.00" ]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Code ISO-4217.
          examples: [ EUR, USD ]

    HealthStatus:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ UP, DOWN ]
        version: { type: string }
        timestamp: { type: string, format: date-time }

    # ── Domain enums ─────────────────────────────────────────
    MovementType:
      type: string
      enum: [ ENTRY, EXIT, TRANSFER ]
    LocationType:
      type: string
      enum: [ SHOP_FLOOR, BACKSTOCK ]
    UserRole:
      type: string
      enum: [ OWNER, SELLER ]

    # ── Product ───────────────────────────────────────────────
    Product:
      type: object
      required: [ productId, name, reference, categoryId, unitPrice, minimumGlobalThreshold ]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        reference: { type: string, minLength: 1, maxLength: 64 }
        categoryId: { type: string, format: uuid }
        unitPrice: { $ref: '#/components/schemas/Money' }
        minimumGlobalThreshold:
          type: integer
          minimum: 0
          description: Global alert threshold (sum across all locations).

    ProductInfo:
      description: Information for creating a product while receiving stock.
      type: object
      required: [ name, reference, categoryId, unitPrice, minimumGlobalThreshold ]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        reference: { type: string, minLength: 1, maxLength: 64 }
        categoryId: { type: string, format: uuid }
        unitPrice: { $ref: '#/components/schemas/Money' }
        minimumGlobalThreshold: { type: integer, minimum: 0 }

    # ── Sale ──────────────────────────────────────────────────
    CreateSaleRequest:
      type: object
      required: [ sellerId, shopId, lines ]
      properties:
        sellerId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateSaleLine' }

    CreateSaleLine:
      type: object
      required: [ productId, quantity ]
      properties:
        productId: { type: string, format: uuid }
        quantity:
          type: integer
          minimum: 1

    SaleResponse:
      type: object
      required: [ saleId, sellerId, lines, totalAmount, createdAt ]
      properties:
        saleId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SaleLineResponse' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        sellerName:
          type: string
          nullable: true
          description: |
            Seller display name. Populated in paginated history; `null` on creation
            and individual lookup, where the caller is the author.

        customerId:
          type: string
          format: uuid
          nullable: true
        amountPaid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        amountDue:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Remaining balance: `0` for a paid sale, positive for a credit sale.
            Populated on creation and in paginated history so the frontend does not
            need to recalculate the balance.

    SaleLineResponse:
      type: object
      required: [ productId, quantity, unitPrice, subtotal ]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }

    # ── Receiving ─────────────────────────────────────────────
    ReceiveStockRequest:
      type: object
      required: [ productReference, shopId, userId, distributions ]
      properties:
        productReference:
          type: string
          minLength: 1
          maxLength: 64
        newProductInfo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProductInfo'
          description: |
            Required if the product does not exist; omit otherwise.
            When present, `newProductInfo.reference` must equal `productReference`.

        shopId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        distributions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceivingDistribution' }

    ReceivingDistribution:
      type: object
      required: [ locationId, quantity ]
      properties:
        locationId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }

    StockReceiptAcknowledgement:
      type: object
      required: [ productId, totalReceived, acceptedAt ]
      properties:
        productId: { type: string, format: uuid }
        totalReceived: { type: integer, minimum: 1 }
        acceptedAt: { type: string, format: date-time }
        movementIds:
          type: array
          items: { type: string, format: uuid }

    # ── Transfer ──────────────────────────────────────────────
    TransferStockRequest:
      type: object
      required: [ productId, sourceLocationId, destinationLocationId, quantity, userId ]
      properties:
        productId: { type: string, format: uuid }
        sourceLocationId: { type: string, format: uuid }
        destinationLocationId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }

    StockTransferAcknowledgement:
      type: object
      required: [ movementId, acceptedAt ]
      properties:
        movementId: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }

    # ── Stock read models ─────────────────────────────────────
    StockLevel:
      type: object
      required: [ productId, locationId, quantity ]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        locationType: { $ref: '#/components/schemas/LocationType' }
        shopId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 0 }

    ProductStockSummary:
      type: object
      required: [ productId, globalQuantity, minimumGlobalThreshold, belowGlobalThreshold, byLocation ]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        globalQuantity: { type: integer, minimum: 0 }
        minimumGlobalThreshold: { type: integer, minimum: 0 }
        belowGlobalThreshold: { type: boolean }
        byLocation:
          type: array
          items: { $ref: '#/components/schemas/StockLevel' }

    StockMovement:
      type: object
      required: [ movementId, productId, locationId, type, quantity, executedBy, executedAt ]
      properties:
        movementId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        destinationLocationId:
          type: string
          format: uuid
          description: Populated only for `type = TRANSFER`.
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: integer, minimum: 1 }
        executedBy: { type: string, format: uuid }
        executedByName:
          type: string
          nullable: true
          description: '`null` if the author account no longer exists.'
        executedAt: { type: string, format: date-time }
        saleId:
          type: string
          format: uuid
          description: Populated only for a sale-related `type = EXIT`.
        operationId:
          type: string
          format: uuid
          description: |
            Operation that created the movement. History groups lines that share
            this identifier.

        saleAmountDue:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          nullable: true
          description: |
            Remaining balance of the sale that created the movement. Absent for
            non-sale movements, zero for paid sales, positive for outstanding credit sales.

    # ── Debts ───────────────────────────────────────────────
    DebtStatus:
      type: string
      default: OUTSTANDING
      enum: [ OUTSTANDING, SETTLED, ALL ]
      description: |
        `OUTSTANDING`: a balance remains due.
        `SETTLED`: the debt is paid and remains available for reference.
        `ALL`: both outstanding and settled debts.

    Debt:
      type: object
      required:
        [ saleId, occurredAt, customerId, customerGivenName, totalAmount,
          amountPaid, amountDue, settled, daysOutstanding, overdue ]
      properties:
        saleId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        customerId: { type: string, format: uuid }
        customerGivenName: { type: string }
        customerFatherName: { type: string, nullable: true }
        customerPhoneNumber: { type: string, nullable: true }
        totalAmount: { $ref: '#/components/schemas/Money' }
        amountPaid:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: Sum of payments, derived from the ledger and never stored.
        amountDue:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: Total minus payments received. Zero for a settled debt.
        settled:
          type: boolean
          description: True when no balance remains due.
        settledAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Settlement date, taken from the last payment.
            `null` while the debt is outstanding.

        daysOutstanding:
          type: integer
          minimum: 0
          description: |
            Days from the sale to today for outstanding debts, or to the settlement
            date for settled debts. The count stops at settlement.

        overdue:
          type: boolean
          description: |
            Whether `daysOutstanding` exceeds the 30-day allowance.
            For outstanding debts, indicates overdue payment; for settled debts,
            indicates late settlement.

    CreditSaleLine:
      type: object
      required: [ productId, productName, quantity, unitPrice, lineTotal ]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        productReference: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unitPrice:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: Price at the time of sale, not the current price.
        lineTotal: { $ref: '#/components/schemas/Money' }

    CreditSalePayment:
      type: object
      required: [ paymentId, amount, receivedAt, receivedById ]
      properties:
        paymentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        receivedAt: { type: string, format: date-time }
        receivedById: { type: string, format: uuid }
        receivedByName:
          type: string
          nullable: true
          description: '`null` if the payment collector account no longer exists.'

    CreditSaleDetail:
      type: object
      required:
        [ saleId, occurredAt, sellerId, customerId, customerGivenName, lines,
          totalAmount, amountPaid, amountDue, settled, payments ]
      properties:
        saleId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        sellerId: { type: string, format: uuid }
        sellerName: { type: string, nullable: true }
        customerId: { type: string, format: uuid }
        customerGivenName: { type: string }
        customerFatherName: { type: string, nullable: true }
        customerPhoneNumber: { type: string, nullable: true }
        lines:
          type: array
          description: In entry order, matching the customer receipt.
          items: { $ref: '#/components/schemas/CreditSaleLine' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        amountPaid: { $ref: '#/components/schemas/Money' }
        amountDue: { $ref: '#/components/schemas/Money' }
        settled: { type: boolean }
        payments:
          type: array
          description: |
            Oldest first. The initial deposit, if any, is the first payment.

          items: { $ref: '#/components/schemas/CreditSalePayment' }

    # ── Generic pagination ──────────────────────────────────
    PageMeta:
      type: object
      required: [ page, size, totalElements, totalPages ]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    PageOfProduct:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { $ref: '#/components/schemas/PageMeta' }

    PageOfSale:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SaleResponse' }
        page: { $ref: '#/components/schemas/PageMeta' }

    PageOfStockLevel:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/StockLevel' }
        page: { $ref: '#/components/schemas/PageMeta' }

    PageOfStockMovement:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/StockMovement' }
        page: { $ref: '#/components/schemas/PageMeta' }

    PageOfDebt:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Debt' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── RFC 7807 Problem Details ──────────────────────────────
    Problem:
      description: |
        RFC 7807 error representation.
        `code`, `errors` and `traceId` are API-specific extensions.

      type: object
      required: [ type, title, status ]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type (documentation).
          examples: [ "https://api.stock.example.com/errors/stock-insufficient" ]
        title:
          type: string
          description: Short, human-readable summary.
          examples: [ "Stock insuffisant" ]
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Detailed explanation of this specific occurrence.
        instance:
          type: string
          format: uri
          description: URI of the affected resource instance.
        code:
          type: string
          description: Stable machine-readable code for frontend mapping.
          examples:
            - PRODUCT_NOT_FOUND
            - STOCK_INSUFFICIENT
            - LOCATION_NOT_FOUND
            - TRANSFER_CROSS_SHOP
            - INVALID_MOVEMENT
            - VALIDATION_FAILED
        errors:
          type: array
          description: Field-level validation errors, when applicable.
          items:
            type: object
            required: [ field, message ]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { }
        traceId:
          type: string
          description: Correlation ID for locating logs.
