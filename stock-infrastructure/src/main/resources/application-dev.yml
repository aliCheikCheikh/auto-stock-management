spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_stock_management
    username: ${DB_USERNAME:auto_stock_user}
    password: ${DB_PASSWORD:auto_stock_password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-a-changer-en-prod-0123456789-abcdefghij}

# Compte d'amorçage local. Le composant associé n'existe que sous le profil dev
# et refuse de créer un compte dès que le registre des utilisateurs n'est plus vide.
INITIAL_OWNER_DISPLAY_NAME: Propriétaire
INITIAL_OWNER_EMAIL: owner@local.dev
INITIAL_OWNER_PASSWORD: dev-owner-password
