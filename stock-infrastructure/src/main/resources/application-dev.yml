spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_stock_management
    username: ${DB_USERNAME:auto_stock_user}
    password: ${DB_PASSWORD:auto_stock_password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-a-changer-en-prod-0123456789-abcdefghij}

# Compte d'amorçage — profil dev UNIQUEMENT.
# Sans ces valeurs, InitialOwnerSeeder ne fait rien et une base fraîche reste inaccessible :
# plus aucun compte ne permet de se connecter. En production, elles proviennent obligatoirement
# de l'environnement (.env / GitHub Secrets) et ne doivent jamais avoir de valeur par défaut.
# Valeurs littérales, sans placeholder : une propriété qui se référencerait elle-même
# (${INITIAL_OWNER_EMAIL:...}) provoquerait une résolution circulaire. Inutile de toute façon,
# les variables d'environnement primant déjà sur les fichiers application-*.yml.
INITIAL_OWNER_EMAIL: owner@local.dev
INITIAL_OWNER_PASSWORD: dev-owner-password