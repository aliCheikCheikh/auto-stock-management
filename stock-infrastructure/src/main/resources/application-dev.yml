spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_stock_management
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
app:
  security:
    jwt:
      secret: ${JWT_SECRET}

# Set INITIAL_OWNER_DISPLAY_NAME, INITIAL_OWNER_EMAIL and INITIAL_OWNER_PASSWORD
# in the environment to create a development owner in an empty user registry.
